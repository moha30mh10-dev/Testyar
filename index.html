<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnswerSheet Pro — Digital Exam Tracking</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = { darkMode:'class', theme:{ extend:{ fontFamily:{ sans:['Inter','Vazirmatn','sans-serif'] } } } };
</script>
<style type="text/tailwindcss">
.card{@apply bg-white dark:bg-slate-800/70 border border-slate-200/80 dark:border-slate-700/50 rounded-2xl shadow-sm;}
.btn{@apply inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all duration-200 select-none cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap;}
.btn-primary{@apply bg-indigo-600 hover:bg-indigo-500 active:scale-[.98] text-white shadow-lg shadow-indigo-600/25;}
.btn-ghost{@apply bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-700/50 dark:hover:bg-slate-700 dark:text-slate-200;}
.btn-danger{@apply bg-rose-600 hover:bg-rose-500 text-white shadow-lg shadow-rose-600/20;}
.btn-success{@apply bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/20;}
.input{@apply w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-300 dark:border-slate-600 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition placeholder:text-slate-400 dark:placeholder:text-slate-500 text-sm;}
.label{@apply block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider;}
.badge{@apply inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold;}
.nav-item{@apply flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-indigo-50 dark:hover:bg-slate-700/60 hover:text-indigo-600 dark:hover:text-white transition cursor-pointer;}
.nav-item.active{@apply bg-indigo-600 text-white shadow-lg shadow-indigo-600/25 hover:bg-indigo-600 hover:text-white dark:hover:bg-indigo-600;}
.icon-btn{@apply p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/60 hover:text-indigo-600 dark:hover:text-white transition cursor-pointer;}
.th{@apply text-start text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 px-3 py-2;}
.td{@apply px-3 py-2.5 text-sm text-slate-700 dark:text-slate-200;}
.chip{@apply px-3 py-1.5 rounded-full text-xs font-bold cursor-pointer transition border;}
.stat-num{@apply text-2xl md:text-3xl font-extrabold text-slate-800 dark:text-white tracking-tight;}
</style>
<style>
html{scroll-behavior:smooth}
body{font-family:'Inter','Vazirmatn',sans-serif;-webkit-font-smoothing:antialiased}
html[lang=fa] body{font-family:'Vazirmatn','Inter',sans-serif}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c7d2fe;border-radius:99px;border:2px solid transparent;background-clip:content-box}
.dark ::-webkit-scrollbar-thumb{background:#475569;border:2px solid transparent;background-clip:content-box}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.anim{animation:fadeUp .35s cubic-bezier(.22,1,.36,1) both}
.anim-scale{animation:scaleIn .22s cubic-bezier(.22,1,.36,1) both}
.grad-text{background:linear-gradient(120deg,#6366f1,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none;z-index:-1}
.opt{display:flex;align-items:center;gap:.85rem;width:100%;padding:.9rem 1rem;border-radius:1rem;border:2px solid;cursor:pointer;transition:all .18s;text-align:start;font-weight:600}
.opt .bubble{width:2.4rem;height:2.4rem;border-radius:.8rem;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;flex-shrink:0;transition:all .18s}
.pal{width:2.35rem;height:2.35rem;border-radius:.7rem;font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid transparent;cursor:pointer;transition:all .15s;position:relative}
.pal:hover{transform:translateY(-2px)}
.pal .dot{position:absolute;bottom:3px;width:5px;height:5px;border-radius:99px;background:#fbbf24}
.kopt{width:2.2rem;height:2.2rem;border-radius:.65rem;font-weight:800;font-size:.8rem;border:2px solid;cursor:pointer;transition:all .15s}
.toast{padding:.8rem 1.1rem;border-radius:.9rem;font-weight:600;font-size:.85rem;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(12px);opacity:0;transition:all .3s;display:flex;gap:.5rem;align-items:center}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#059669}.toast.error{background:#e11d48}.toast.info{background:#4f46e5}
#sidebar{transition:width .25s,transform .3s}
@media (max-width:1023px){
 #sidebar{position:fixed;inset-block:0;inset-inline-start:0;z-index:45;width:17rem}
 html[dir=ltr] #sidebar.closed{transform:translateX(-105%)}
 html[dir=rtl] #sidebar.closed{transform:translateX(105%)}
}
@media (min-width:1024px){
 #sidebar.mini{width:5.25rem}
 #sidebar.mini .nav-label,#sidebar.mini .side-extra{display:none}
 #sidebar.mini .nav-item{justify-content:center;padding:.8rem}
}
#printArea{display:none}
@media print{
 aside#sidebar,header#topbar,.no-print,#toastRoot,#modalRoot{display:none!important}
 body{background:#fff!important}
 main#view{overflow:visible!important;padding:0!important}
 .card{box-shadow:none!important;border:1px solid #d4d4d8!important;break-inside:avoid}
 body.print-blank #app{display:none!important}
 body.print-blank #printArea{display:block!important;color:#000}
}
.bs-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px;margin-top:14px}
.bs-row{display:flex;align-items:center;gap:10px;padding:3px 0;border-bottom:1px dotted #bbb}
.bs-row b{width:28px}
.bs-b{width:26px;height:26px;border-radius:99px;border:1.6px solid #333;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-inline-end:4px}
.search-drop{position:absolute;top:calc(100% + 8px);inset-inline:0;z-index:50;max-height:22rem;overflow-y:auto}
.ring-track{stroke:rgba(148,163,184,.2)}
.progress-track{@apply bg-slate-200 dark:bg-slate-700;}
</style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300">
<div class="blob w-[34rem] h-[34rem] bg-indigo-400 dark:bg-indigo-700 -top-40 -start-40"></div>
<div class="blob w-[30rem] h-[30rem] bg-fuchsia-300 dark:bg-fuchsia-800 bottom-0 -end-40"></div>

<div id="authScreen"></div>

<div id="app" class="hidden h-screen flex overflow-hidden">
  <div id="sideOverlay" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden"></div>
  <aside id="sidebar" class="closed w-68 lg:w-68 flex-shrink-0 bg-white dark:bg-slate-800/80 backdrop-blur border-e border-slate-200 dark:border-slate-700/60 flex flex-col" style="width:17rem"></aside>
  <div class="flex-1 flex flex-col min-w-0">
    <header id="topbar" class="h-16 flex-shrink-0 flex items-center gap-3 px-4 md:px-6 bg-white/80 dark:bg-slate-800/60 backdrop-blur border-b border-slate-200 dark:border-slate-700/60 z-30"></header>
    <main id="view" class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8"></main>
  </div>
</div>

<div id="printArea"></div>
<div id="modalRoot"></div>
<div id="toastRoot" class="fixed bottom-5 inset-x-0 z-[60] flex flex-col items-center gap-2 pointer-events-none px-4"></div>

function findBook(bid){ return D.books.find(b=>b.id===bid)||null; }
function findTest(testId){ for(const b of D.books) for(const c of (b.chapters||[])) for(const tt of (c.tests||[])) if(tt.id===testId) return {book:b,chapter:c,test:tt}; return null; }
function findChapter(cid){ for(const b of D.books) for(const c of (b.chapters||[])) if(c.id===cid) return {book:b,chapter:c}; return null; }
function bookQuestionCount(b){ return (b.chapters||[]).reduce((s,c)=>s+(c.tests||[]).reduce((x,tt)=>x+(tt.questionCount||0),0),0); }
function bookTestCount(b){ return (b.chapters||[]).reduce((s,c)=>s+(c.tests||[]).length,0); }
function keyCount(test){ return Object.keys(test.key||{}).length; }
function allTests(){ const out=[]; for(const b of D.books) for(const c of (b.chapters||[])) for(const tt of (c.tests||[])) out.push({book:b,chapter:c,test:tt}); return out; }
function uniqueSubjects(){ return [...new Set(D.books.map(b=>(b.subject||'').trim()).filter(Boolean))]; }
function attemptsForBook(bid){ return D.attempts.filter(a=>a.bookId===bid); }
function attemptsForTest(tid){ return D.attempts.filter(a=>a.testId===tid); }
function aggregate(list){ const r={tests:list.length,total:0,correct:0,incorrect:0,unanswered:0,answered:0,time:0,score:0,accuracy:0,completion:0,avgScore:0};
 for(const a of list){ const x=a.results||{}; r.total+=x.total||0; r.correct+=x.correct||0; r.incorrect+=x.incorrect||0; r.unanswered+=x.unanswered||0; r.time+=a.timeSpent||0; r.score+=x.score||0; }
 r.answered=r.correct+r.incorrect; r.accuracy=r.answered===0?0:r.correct/r.answered*100; r.completion=r.total===0?0:r.answered/r.total*100; r.avgScore=r.tests?r.score/r.tests:0; return r; }
function gradeCompute(answers,key,total,scoring){ let correct=0,incorrect=0,unanswered=0,unkeyed=0; const detail={};
 for(let i=1;i<=total;i++){ const a=answers[i];
  if(!key[i]){ detail[i]='unanswered'; unanswered++; if(a) unkeyed++; continue; }
  if(a==null||a===''){ detail[i]='unanswered'; unanswered++; }
  else if(key[i]===a){ detail[i]='correct'; correct++; }
  else { detail[i]='incorrect'; incorrect++; } }
 const answered=correct+incorrect; const accuracy=answered===0?0:correct/answered*100; const completion=total===0?0:answered/total*100;
 let score=correct; if(scoring&&scoring.negative){ score=correct-incorrect*(Number(scoring.penalty)||0); }
 return {detail,unkeyed,results:{total,correct,incorrect,unanswered,answered,accuracy,completion,score,maxScore:total}}; }
function chapterAgg(list){ const m={};
 for(const a of list){ const det=a.detail||{}; for(const q in det){ const cid=(a.qChapters&&a.qChapters[q])||a.chapterId||'__none'; (m[cid]=m[cid]||{correct:0,incorrect:0,unanswered:0})[det[q]]++; } } return m; }
function chapterName(cid){ const f=findChapter(cid); return f?{name:f.chapter.title,book:f.book.title,subject:f.book.subject}:null; }

 a.detail=g.detail; a.unkeyed=g.unkeyed; a.results=g.results; a.keySnapshot={...key}; if(f) a.explanationsSnapshot={...(f.test.explanations||{})};

// ---------------- Weakness Analysis ----------------
function renderAnalysis(){ const v=$('#view'); const list=D.attempts;
 if(!list.length){ v.innerHTML=`<div class="max-w-3xl mx-auto mt-6">${emptyState('pulse',t('analysis'),t('notEnoughData'),`<button class="btn btn-primary" onclick="nav('/sheets')">${icon('play','w-4 h-4')}${t('startNewTest')}</button>`)}</div>`; return; }
 const chAgg=chapterAgg(list);
 const chRows=Object.entries(chAgg).map(([cid,x])=>{ const n=chapterName(cid); const ans=x.correct+x.incorrect; return {cid,name:n?n.name:t('unknownChapter'),book:n?n.book:'—',subject:n?(n.subject||''):'',x,ans,err:ans?x.incorrect/ans*100:0}; }).filter(r=>r.ans>0);
 const weak=[...chRows].filter(r=>r.ans>=3).sort((a,b)=>b.err-a.err).slice(0,6);
 // missed questions
 const missed={};
 list.forEach(a=>{ const det=a.detail||{}; for(const q in det){ if(det[q]!=='incorrect') continue; const k=(a.testId||'p')+':'+q; (missed[k]=missed[k]||{n:0,test:a.title,book:a.bookTitle,q,corr:(a.keySnapshot||{})[q],tid:a.testId}).n++; } });
 const missedRows=Object.values(missed).sort((a,b)=>b.n-a.n).slice(0,8);
 // subjects
 const subMap={}; list.forEach(a=>{ const b=findBook(a.bookId); if(!b||!b.subject) return; (subMap[b.subject]=subMap[b.subject]||[]).push(a); });
 const subRows=Object.entries(subMap).map(([s,l])=>({s,g:aggregate(l)})).sort((a,b)=>a.g.accuracy-b.g.accuracy);
 // trend: first half vs second half by time
 const sorted=[...list].sort((a,b)=>a.submittedAt-b.submittedAt); const half=Math.floor(sorted.length/2);
 const g1=aggregate(sorted.slice(0,half||1)), g2=aggregate(sorted.slice(half||1));
 const trendDiff=sorted.length>=4?g2.accuracy-g1.accuracy:0;
 const trendLabel=sorted.length<4?t('stable'):trendDiff>3?t('improving'):trendDiff<-3?t('declining'):t('stable');
 const trendColor=trendLabel===t('improving')?'text-emerald-500':trendLabel===t('declining')?'text-rose-500':'text-slate-400';
 v.innerHTML=`<div class="max-w-6xl mx-auto space-y-5">
 <div class="card p-6 anim flex flex-wrap items-center gap-5">
  <div class="w-12 h-12 rounded-2xl bg-fuchsia-100 dark:bg-fuchsia-500/15 text-fuchsia-500 flex items-center justify-center">${icon('pulse','w-6 h-6')}</div>
  <div class="flex-1 min-w-[200px]"><h1 class="text-xl font-extrabold">${t('analysis')}</h1><p class="text-sm text-slate-400">${t('basedOnErrors')}</p></div>
  <div class="text-center px-4"><div class="text-xs font-bold text-slate-400 uppercase">${t('trend')}</div><div class="text-lg font-extrabold ${trendColor}">${trendLabel}</div></div>
  <button class="btn btn-primary no-print" onclick="buildMistakePractice()">${icon('play','w-4 h-4')}${t('practiceFromMistakes')}</button>
 </div>
 <div class="grid lg:grid-cols-2 gap-4">
  <div class="card p-6 anim"><b class="block mb-4">${t('weakChapters')}</b>
   ${weak.length?`<div class="space-y-3">${weak.map(r=>`<div><div class="flex justify-between text-sm mb-1"><span class="font-bold truncate">${esc(r.name)} <span class="text-xs text-slate-400 font-semibold">• ${esc(r.book)}</span></span><span class="text-xs font-extrabold text-rose-500 whitespace-nowrap">${t('errorRate')} ${pct(r.err,0)}</span></div>${bar(r.err,'linear-gradient(90deg,#f43f5e,#fb923c)')}<div class="text-[11px] text-slate-400 mt-0.5">${dnum(r.x.incorrect)} ${t('incorrect').toLowerCase()} / ${dnum(r.ans)} ${t('answeredCol').toLowerCase()}</div></div>`).join('')}</div>`:`<p class="text-sm text-slate-400 text-center py-8">${t('noChapterData')}</p>`}
  </div>
  <div class="card p-6 anim"><b class="block mb-4">${t('missedQuestions')}</b>
   ${missedRows.length?`<div class="space-y-2">${missedRows.map(m=>`<div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/50"><span class="badge bg-rose-100 text-rose-600 dark:bg-rose-500/15 dark:text-rose-400">Q${dnum(m.q)}</span><div class="flex-1 min-w-0"><div class="text-sm font-bold truncate">${esc(m.test)}</div><div class="text-xs text-slate-400 truncate">${esc(m.book)}</div></div><span class="text-xs font-bold text-slate-400 whitespace-nowrap">${t('correctAnswer')}: <b class="text-emerald-500">${m.corr||'—'}</b></span><span class="badge bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-300">×${dnum(m.n)}</span></div>`).join('')}</div>`:`<p class="text-sm text-slate-400 text-center py-8">${t('noMistakes')}</p>`}
  </div>
 </div>
 <div class="grid lg:grid-cols-2 gap-4">
  <div class="card p-6 anim"><b class="block mb-4">${t('subjectFocus')}</b>
   ${subRows.length?`<div class="space-y-3">${subRows.map(r=>`<div class="flex items-center gap-3"><span class="w-28 truncate text-sm font-bold">${esc(r.s)}</span><div class="flex-1">${bar(r.g.accuracy,r.g.accuracy>=80?'#10b981':r.g.accuracy>=60?'#f59e0b':'#f43f5e')}</div><span class="text-xs font-extrabold ${accColor(r.g.accuracy)} w-14 text-end">${pct(r.g.accuracy,0)}</span></div>`).join('')}</div>`:`<p class="text-sm text-slate-400 text-center py-8">${t('noDataRange')}</p>`}
  </div>
  <div class="card p-6 anim"><b class="block mb-4">${t('recommendations')}</b>
   ${weak.length?`<div class="space-y-2.5">${weak.slice(0,3).map((r,i)=>`<div class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 dark:border-slate-700"><span class="w-8 h-8 rounded-lg bg-indigo-100 dark:bg-indigo-500/15 text-indigo-500 flex items-center justify-center font-extrabold text-sm">${dnum(i+1)}</span><div class="flex-1 min-w-0"><div class="text-sm font-bold truncate">${esc(r.name)}</div><div class="text-xs text-slate-400 truncate">${esc(r.book)}${r.subject?' • '+esc(r.subject):''}</div></div><span class="badge bg-rose-100 text-rose-600 dark:bg-rose-500/15 dark:text-rose-400">${pct(r.err,0)}</span></div>`).join('')}</div>
   <p class="text-xs text-slate-400 mt-4">${t('recommendedNext')} — ${t('basedOnErrors')}.</p>`:`<p class="text-sm text-slate-400 text-center py-8">${t('noMistakes')}</p>`}
  </div>
 </div></div>`; }
function buildMistakePractice(){ const seen={}; const items=[];
 for(const a of D.attempts){ const det=a.detail||{};
  for(const q in det){ const k=(a.testId||'p')+':'+q; if(seen[k]) continue; seen[k]=true;
   if(det[q]==='correct') continue;
   let key,exp,opts=a.optionsCount||4,ref;
   if(a.practice){ const it=(a.items||[])[+q-1]; if(!it) continue; key=it.key; exp=it.explanation; opts=it.optionsCount||4; ref=it.ref; }
   else { const f=findTest(a.testId); key=f?(f.test.key||{})[q]:(a.keySnapshot||{})[q]; exp=f?(f.test.explanations||{})[q]:(a.explanationsSnapshot||{})[q]; if(f) opts=f.test.optionsCount; ref=a.bookTitle+' • '+a.title+' • Q'+q; }
   if(!key) continue;
   items.push({testId:a.testId,qNum:+q,key,explanation:exp,optionsCount:opts,ref,chapterId:(a.qChapters||{})[q]||a.chapterId});
   if(items.length>=50) break; }
  if(items.length>=50) break; }
 if(!items.length) return toast(t('noMistakes'),'info');
 window._practiceItems=items; nav('/practice'); toast(t('practiceBuilt'),'info'); }

// ---------------- Settings ----------------
function renderSettings(){ const v=$('#view'); const st=getSettings();
 v.innerHTML=`<div class="max-w-3xl mx-auto space-y-5">
 <div class="card p-6 anim">
  <h3 class="font-extrabold mb-4 flex items-center gap-2">${icon('user','w-5 h-5')}${t('profile')}</h3>
  <div class="grid sm:grid-cols-2 gap-4">
   <div><label class="label">${t('fullName')}</label><input id="stName" class="input" value="${esc(U.name)}"></div>
   <div><label class="label">${t('email')}</label><input class="input opacity-60" value="${esc(U.email)}" disabled dir="ltr"></div>
  </div>
  <div class="flex justify-end mt-4"><button class="btn btn-primary" id="stSaveProfile">${t('save')}</button></div>
  <div class="border-t border-slate-100 dark:border-slate-700 mt-5 pt-5">
   <h4 class="font-bold text-sm mb-3">${t('changePassword')}</h4>
   <div class="grid sm:grid-cols-3 gap-4">
    <div><label class="label">${t('currentPassword')}</label><input id="stCurP" type="password" class="input" dir="ltr"></div>
    <div><label class="label">${t('newPassword')}</label><input id="stNewP" type="password" class="input" dir="ltr"></div>
    <div><label class="label">${t('confirmPassword')}</label><input id="stNewP2" type="password" class="input" dir="ltr"></div>
   </div>
   <div class="flex justify-end mt-4"><button class="btn btn-ghost" id="stPassBtn">${t('changePassword')}</button></div>
  </div>
 </div>
 <div class="card p-6 anim">
  <h3 class="font-extrabold mb-1 flex items-center gap-2">${icon('sun','w-5 h-5')}${t('appearance')}</h3>
  <p class="text-xs text-slate-400 mb-4">${t('prefTheme')}</p>
  <div class="grid sm:grid-cols-2 gap-4">
   <div><label class="label">${t('theme')}</label><div class="flex gap-2"><button class="chip flex-1 ${st.theme!=='dark'?'bg-indigo-600 text-white border-indigo-600':'bg-slate-50 dark:bg-slate-900/50 border-slate-200 dark:border-slate-600 text-slate-500'}" onclick="setTheme('light')">${t('light')}</button><button class="chip flex-1 ${st.theme==='dark'?'bg-indigo-600 text-white border-indigo-600':'bg-slate-50 dark:bg-slate-900/50 border-slate-200 dark:border-slate-600 text-slate-500'}" onclick="setTheme('dark')">${t('dark')}</button></div></div>
   <div><label class="label">${t('language')}</label><div class="flex gap-2"><button class="chip flex-1 ${LANG==='en'?'bg-indigo-600 text-white border-indigo-600':'bg-slate-50 dark:bg-slate-900/50 border-slate-200 dark:border-slate-600 text-slate-500'}" onclick="setLang('en')">English</button><button class="chip flex-1 ${LANG==='fa'?'bg-indigo-600 text-white border-indigo-600':'bg-slate-50 dark:bg-slate-900/50 border-slate-200 dark:border-slate-600 text-slate-500'}" onclick="setLang('fa')">فارسی</button></div></div>
  </div>
  <div class="border-t border-slate-100 dark:border-slate-700 mt-5 pt-5">
   <h4 class="font-bold text-sm mb-3">${t('defaults')}</h4>
   <div class="grid sm:grid-cols-2 gap-4 items-end">
    <label class="flex items-center gap-2.5 p-3 rounded-xl bg-slate-50 dark:bg-slate-900/50 cursor-pointer text-sm font-bold"><input type="checkbox" id="stNegD" class="w-4 h-4 accent-indigo-600" ${st.negDefault?'checked':''}>${t('enableNeg')}</label>
    <div><label class="label">${t('penalty')}</label><input id="stPenD" type="number" step="0.05" min="0" class="input" value="${st.penaltyDefault||0.25}"></div>
   </div>
   <div class="flex justify-end mt-4"><button class="btn btn-primary" id="stDefBtn">${t('save')}</button></div>
  </div>
 </div>
 <div class="card p-6 anim">
  <h3 class="font-extrabold mb-4 flex items-center gap-2">${icon('layers','w-5 h-5')}${t('dataMgmt')}</h3>
  <div class="flex flex-wrap gap-2">
   <button class="btn btn-ghost" id="stExport">${icon('download','w-4 h-4')}${t('exportAll')}</button>
   <label class="btn btn-ghost cursor-pointer">${icon('upload','w-4 h-4')}${t('importAll')}<input type="file" id="stImport" accept=".json" class="hidden"></label>
   <button class="btn btn-ghost hover:!text-rose-500" id="stClear">${icon('trash','w-4 h-4')}${t('clearAll')}</button>
  </div>
  <div class="border-t border-slate-100 dark:border-slate-700 mt-5 pt-5">
   <button class="btn btn-danger" id="stDelAcc">${icon('trash','w-4 h-4')}${t('deleteAccount')}</button>
  </div>
 </div></div>`;
 $('#stSaveProfile').onclick=()=>{ const n=$('#stName').value.trim(); if(!n) return toast(t('fillAll'),'error'); U.name=n; saveUsers(); toast(t('profileUpdated')); renderSidebar(); };
 $('#stPassBtn').onclick=async()=>{ const cur=$('#stCurP').value,p1=$('#stNewP').value,p2=$('#stNewP2').value; if(!cur||!p1) return toast(t('fillAll'),'error'); if(p1.length<6) return toast(t('passShort'),'error'); if(p1!==p2) return toast(t('passMismatch'),'error');
  if(await hash(cur)!==U.pass) return toast(t('wrongPassword'),'error'); U.pass=await hash(p1); saveUsers(); toast(t('passwordChanged')); route(); };
 $('#stDefBtn').onclick=()=>{ st.negDefault=$('#stNegD').checked; st.penaltyDefault=+$('#stPenD').value||0; saveUsers(); toast(t('saved')); };
 $('#stExport').onclick=()=>{ downloadFile('answersheet_backup_'+dayKey(Date.now())+'.json',JSON.stringify({app:'answersheet-pro',type:'full',user:{name:U.name,email:U.email},data:D},null,1),'application/json'); };
 $('#stImport').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=async()=>{ try{ const obj=JSON.parse(r.result); const data=obj.data||obj; if(!Array.isArray(data.books)||!Array.isArray(data.attempts)) throw 0;
   if(!await confirmDialog(t('importAll'),t('areYouSure')+' '+t('thisAction'),t('import'),false)) return;
   D={books:data.books,attempts:data.attempts,drafts:data.drafts||{}}; saveData(); toast(t('dataImported')); route(); }catch(err){ toast(t('importErr'),'error'); } }; r.readAsText(f); };
 $('#stClear').onclick=async()=>{ if(!await confirmDialog(t('areYouSure'),t('confirmClearAll'),t('yesClear'))) return; D={books:[],attempts:[],drafts:{}}; saveData(); toast(t('deleted'),'info'); nav('/dashboard'); route(); };
 $('#stDelAcc').onclick=async()=>{ if(!await confirmDialog(t('areYouSure'),t('confirmDelAccount'),t('yesDelete'))) return; const users=DB.read('das_users',{}); delete users[U.id]; DB.write('das_users',users); DB.remove('das_data_'+U.id); logout(); }; }
function setTheme(th){ const st=getSettings(); st.theme=th; saveUsers(); applyTheme(th); renderTopbar(); route(); }
function setLang(l){ const st=getSettings(); st.lang=l; LANG=l; saveUsers(); applyLang(); renderSidebar(); renderTopbar(); route(); }

// ---------------- Print blank sheet ----------------
function printBlankSheet(tid){ const f=findTest(tid); if(!f) return; const letters=LETTERS(f.test.optionsCount||4);
 let rows=''; for(let i=1;i<=f.test.questionCount;i++){ rows+=`<div class="bs-row"><b>${i}</b><span>${letters.map(l=>`<span class="bs-b">${l}</span>`).join('')}</span></div>`; }
 $('#printArea').innerHTML=`<div style="font-family:Inter,sans-serif;padding:10px">
 <h1 style="font-size:20px;font-weight:800;margin-bottom:4px">${esc(f.book.title)} — ${esc(f.test.title)}</h1>
 <p style="font-size:12px;color:#444">${esc(f.chapter.title)} • ${f.test.questionCount} ${t('questionsL')}</p>
 <div style="display:flex;gap:30px;margin-top:12px;font-size:13px"><span>${t('blankSheetName')}: ____________________</span><span>${t('blankSheetDate')}: ____________</span><span>${t('blankSheetGrade')}: ____________</span></div>
 <div class="bs-grid">${rows}</div></div>`;
 document.body.classList.add('print-blank'); window.print(); }
window.addEventListener('afterprint',()=>document.body.classList.remove('print-blank'));

// ---------------- Init ----------------
(function init(){ const prefs=DB.read('das_prefs',{theme:'light',lang:'en'}); LANG=prefs.lang||'en'; applyLang(); applyTheme(prefs.theme);
 const sid=DB.read('das_session',null); const users=DB.read('das_users',{});
 if(sid&&users[sid]){ U=users[sid]; initApp(); } else showAuth(); })();
</script>
